[project]
name = "zwo-webcam"
version = "0.1.0"
description = "Use a ZWO ASI camera as a browser-viewable webcam (MJPEG)"
authors = [
    { name = "ubutnux", email = "muhammad.yusuf@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.5",
    "numpy>=2.5.4",
    "opencv-python>=5.0.0.93",
    "pyzwoasi>=0.2.7",
]

[project.scripts]
zwo-webcam = "zwo_webcam:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
